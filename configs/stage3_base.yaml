# Stage 3: 离线 IQL
#
# 前置条件：
#   1. train_oracle.py       → oracle_base/best.pt
#   2. train_stage1/2.py     → stage2_base/best.pt（Stage3 初始化权重）
#   3. train_grp.py          → grp 模型
#   4. fill_grp_rewards.py   → data/annotated_grp（填入 grp_reward 字段）
#
# ── 收敛目标 ──────────────────────────────────────────────────
#   指标            说明                       目标
#   val q_loss      Bellman Q 误差             持续下降，稳定 < 5.0
#   val v_loss      expectile V 误差           持续下降，稳定 < 5.0
#   val bc          AWR BC anchor loss         < 0.25（不应比 Stage2 的 0.19 高太多）
#   val bel_recall  BeliefNet 手牌召回率       > 0.85（Stage2 末 ~0.79，Stage3 继续提升）
#   val wait        待张预测 BCE               持续下降（wait_weight=0.5 放开训练）
#   arena delta     vs Stage2 baseline 顺位差  <= 0.0（challenger 顺位不高于 baseline）
# ─────────────────────────────────────────────────────────────

stage: 3
model_preset: base
stage1_ckpt: /root/autodl-tmp/rinshan/checkpoints/stage1_base/best_v3.pt
stage2_ckpt: /root/autodl-tmp/rinshan/checkpoints/stage2_base/best_v4_fixed.pt

# ── RIICHI embedding 初始化 ──────────────────────────────────────────────────
# 独立于加载分支，无论是 resume 还是从 S1/S2 加载，flag 都生效。
# true ：启动时执行一次 reinit，用相邻 special-action token 均值覆盖 RIICHI embedding。
#        适用：老版 S1/S2 里没有 RIICHI 候选样本，embedding 是噪声，需要重新初始化。
# false：保留 checkpoint 里现有的 RIICHI embedding，不做任何修改。
#        适用：新版 S1/S2 已包含 RIICHI 训练信号，embedding 本身已有意义。
reinit_riichi_embed: false

data_dir: /root/autodl-tmp/rinshan/data/annotated_grp
# 注意：GRP 2.0 不再把每局 reward 广播到所有 action。
# MjaiDataset(stage=3) 会仅在 GRP 游戏状态变化时把 reward 记到该局最后一个 action。
val_ratio: 0.02
shuffle_buffer: 5000

lr: 1e-4
weight_decay: 0.01
warmup_steps: 2000
total_steps: 150_000
# cosine_t_max: cosine 退火的完整周期长度（optimizer update step 数）。
# 不填（或填 0）时退化为旧行为：total_steps - warmup_steps。
# 设置后 total_steps 只控制"训练跑多少步"，两者完全独立。
# 典型用法：
#   先探索 50k 步 → total_steps: 50_000, cosine_t_max: 150000
#   发现好了继续跑 → total_steps: 150_000，cosine_t_max 不变，LR 曲线形状不变
cosine_t_max: 148000   # = 150000 - warmup_steps(2000)，与初始设计一致
weights_only_save: false
batch_size: 1024          # compile=True 下 93GB/96GB，effective batch=2048
grad_accum_steps: 2       # 等效 batch=1024
max_grad_norm: 1.0

# CQL / BC 稳定性保护
# 目标：普通打牌尽量贴住 Stage2，不让 Stage3 漂成“乱打”；
# 同时对“可立直局面”提高学习密度，并降低 RIICHI 动作本身的 BC 约束。
cql_weight: 0.5
bc_weight: 0.5
reward_clip: 20.0
value_clip: 50.0
adv_clip: 5.0
awr_temperature: 3.0
awr_max_weight: 5.0
game_expectile: 0.95
hand_expectile: 0.70
game_reward_weight: 1.0
hand_reward_weight: 1.0
# 立直专项强化：当前状态合法动作里包含 RIICHI 时，整个样本 loss 放大
riichi_legal_sample_weight: 3.0
# 选择 RIICHI 动作时的 BC 缩放：0=完全豁免，1=和普通动作一样
riichi_bc_scale: 0.0
stage3_anchor_weight: 0.2
stage3_anchor_temperature: 1.0
riichi_rank_weight: 0.0
riichi_margin: 0.2

# Belief/Wait 权重
# Stage3 首要目标是稳住主策略，辅助头降权避免干扰出牌与立直学习
belief_weight:     0.5
belief_pos_weight: 2.4
wait_weight:       0.1

# IQL 超参
target_update_every: 100
arena_gate_games: 200
arena_parallel_games: 64
arena_parallel_groups: 16
arena_gate_every: 5
arena_gate_rank_delta_threshold: 0.0
arena_gate_baseline_ckpt: /root/autodl-tmp/rinshan/checkpoints/stage2_base/best_v4_fixed.pt

dtype: bfloat16
amp: true
compile: true

save_dir: /root/autodl-tmp/rinshan/checkpoints/stage3_base
save_every: 2000
log_every: 100
val_every: 1000

device: cuda
num_workers: 16
pin_memory: true
