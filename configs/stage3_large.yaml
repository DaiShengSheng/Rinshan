# Stage 3: 离线 IQL (Large 规模)

stage: 3
model_preset: large
stage1_ckpt: checkpoints/stage1_large/best.pt
stage2_ckpt: checkpoints/stage2_large/best.pt

# RIICHI embedding 初始化（true=老版S1/S2噪声需要reinit，false=新版S1/S2已有信号）
reinit_riichi_embed: false
# Stage3: 普通打牌保持稳定，仅对可立直局面提升学习密度
riichi_legal_sample_weight: 3.0
riichi_bc_scale: 0.0
stage3_anchor_weight: 0.2
stage3_anchor_temperature: 1.0
riichi_rank_weight: 0.0
riichi_margin: 0.2

data_dir: data/annotated_grp
val_ratio: 0.02
shuffle_buffer: 5000

lr: 1e-5
weight_decay: 0.01
warmup_steps: 1000
total_steps: 200_000
batch_size: 128
grad_accum_steps: 8       # 等效 batch=1024
max_grad_norm: 1.0

# IQL 超参
cql_weight: 0.1
bc_weight: 0.2
reward_clip: 20.0
value_clip: 50.0
adv_clip: 20.0
awr_temperature: 3.0
awr_max_weight: 20.0
game_expectile: 0.95
hand_expectile: 0.70
game_reward_weight: 1.0
hand_reward_weight: 1.0
target_update_every: 100
arena_gate_games: 200
arena_parallel_games: 64
arena_parallel_groups: 16
arena_gate_every: 5
arena_gate_rank_delta_threshold: 0.0
arena_gate_baseline_ckpt: checkpoints/stage2_large/best.pt

dtype: bfloat16
amp: true
compile: true

save_dir: checkpoints/stage3_large
save_every: 5000
log_every: 100
val_every: 2000

device: cuda
num_workers: 16
pin_memory: true
